services:
  kisan-mitra:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Drop rice_disease_model.tflite here — no rebuild needed
      - ./backend/models:/app/backend/models
      # SQLite DB persists across restarts
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
