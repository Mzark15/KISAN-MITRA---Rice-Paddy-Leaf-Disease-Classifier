<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan Mitra — Field Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root { --green-900:#1b4332; --green-700:#2d6a4f; --green-100:#d8f3dc; --green-50:#f1faee; --border:#b7e4c7; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:system-ui,sans-serif; background:var(--green-50); color:#1b1b1b; }
        .container { max-width:960px; margin:0 auto; padding:1rem; }
        header { background:linear-gradient(135deg,var(--green-900),var(--green-700)); color:#fff; padding:1rem; border-radius:0 0 1rem 1rem; margin-bottom:1rem; }
        .card { background:#fff; border:1px solid var(--border); border-radius:.75rem; padding:1rem; margin-bottom:1rem; }
        .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:.75rem; margin-bottom:1rem; }
        .stat { background:#fff; border:1px solid var(--border); border-radius:.75rem; padding:1rem; text-align:center; }
        .stat .val { font-size:1.75rem; font-weight:700; color:var(--green-900); }
        .stat .lbl { font-size:.8rem; color:#5c5c5c; }
        .charts { display:grid; grid-template-columns:1fr; gap:1rem; }
        @media(min-width:700px){ .charts { grid-template-columns:1fr 1fr; } }
        table { width:100%; border-collapse:collapse; font-size:.85rem; }
        th,td { padding:.5rem; border-bottom:1px solid var(--border); text-align:left; }
        th { background:var(--green-100); color:var(--green-900); }
        #loginOverlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100; }
        #loginBox { background:#fff; padding:1.5rem; border-radius:.75rem; width:90%; max-width:320px; }
        #loginBox input { width:100%; padding:.5rem; margin:.75rem 0; border:1px solid var(--border); border-radius:.5rem; }
        #loginBox button { width:100%; padding:.65rem; background:var(--green-700); color:#fff; border:none; border-radius:.5rem; cursor:pointer; }
        .hidden { display:none !important; }
        a { color:var(--green-700); }
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div id="loginBox">
            <h2 style="margin:0 0 .5rem">Field Team Login</h2>
            <p style="font-size:.85rem;color:#5c5c5c;margin:0">Internal pilot dashboard</p>
            <input type="password" id="passwordInput" placeholder="Password" autofocus>
            <button id="loginBtn">Enter</button>
            <p id="loginError" class="hidden" style="color:#b00020;font-size:.85rem">Wrong password</p>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <header>
            <div class="container">
                <h1 style="margin:0">Kisan Mitra — Pilot Dashboard</h1>
                <p style="margin:.25rem 0 0;opacity:.9;font-size:.9rem">Auto-refreshes every 60s · <a href="/" style="color:#d8f3dc">← Back to app</a></p>
            </div>
        </header>
        <div class="container">
            <div class="cards" id="summaryCards"></div>
            <div class="charts">
                <div class="card"><h3>Top 5 Diseases</h3><canvas id="barChart"></canvas></div>
                <div class="card"><h3>Diagnoses (Last 7 Days)</h3><canvas id="lineChart"></canvas></div>
            </div>
            <div class="card">
                <h3>Recent Diagnoses</h3>
                <div style="overflow-x:auto">
                    <table>
                        <thead><tr><th>Time</th><th>Disease</th><th>Conf.</th><th>Lang</th><th>Village</th><th>Feedback</th></tr></thead>
                        <tbody id="recentTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        // Match DASHBOARD_PASSWORD in .env (default: kisan123)
        const DASHBOARD_PASSWORD = "kisan123";

        let barChartInst = null;
        let lineChartInst = null;

        document.getElementById("loginBtn").addEventListener("click", tryLogin);
        document.getElementById("passwordInput").addEventListener("keydown", e => {
            if (e.key === "Enter") tryLogin();
        });

        function tryLogin() {
            const pw = document.getElementById("passwordInput").value;
            if (pw === DASHBOARD_PASSWORD) {
                document.getElementById("loginOverlay").classList.add("hidden");
                document.getElementById("dashboard").classList.remove("hidden");
                loadDashboard();
                setInterval(loadDashboard, 60000);
            } else {
                document.getElementById("loginError").classList.remove("hidden");
            }
        }

        async function loadDashboard() {
            try {
                const [statsRes, recentRes] = await Promise.all([
                    fetch(`${API_URL}/dashboard/stats`),
                    fetch(`${API_URL}/dashboard/recent?limit=20`),
                ]);
                const stats = await statsRes.json();
                const recent = await recentRes.json();
                renderSummary(stats);
                renderCharts(stats);
                renderTable(recent);
            } catch (e) {
                console.error(e);
            }
        }

        function renderSummary(s) {
            document.getElementById("summaryCards").innerHTML = [
                ["Diagnoses", s.total_diagnoses],
                ["Chats", s.total_chats],
                ["Voice", s.total_voice_sessions],
                ["Helpful %", s.helpful_feedback_pct + "%"],
                ["Avg Conf.", s.avg_confidence + "%"],
            ].map(([lbl, val]) => `<div class="stat"><div class="val">${val}</div><div class="lbl">${lbl}</div></div>`).join("");
        }

        function renderCharts(s) {
            const sorted = Object.entries(s.disease_breakdown).sort((a,b) => b[1]-a[1]).slice(0,5);
            const barCtx = document.getElementById("barChart").getContext("2d");
            if (barChartInst) barChartInst.destroy();
            barChartInst = new Chart(barCtx, {
                type: "bar",
                data: {
                    labels: sorted.map(x => x[0]),
                    datasets: [{ label: "Count", data: sorted.map(x => x[1]), backgroundColor: "#40916c" }],
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
            });

            const lineCtx = document.getElementById("lineChart").getContext("2d");
            if (lineChartInst) lineChartInst.destroy();
            lineChartInst = new Chart(lineCtx, {
                type: "line",
                data: {
                    labels: s.last_7_days_diagnoses.map(d => d.date.slice(5)),
                    datasets: [{ label: "Diagnoses", data: s.last_7_days_diagnoses.map(d => d.count), borderColor: "#2d6a4f", tension: 0.3, fill: false }],
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
            });
        }

        function renderTable(rows) {
            const fb = v => v === null ? "—" : v === 1 ? "👍" : "👎";
            document.getElementById("recentTable").innerHTML = rows.map(r => `
                <tr>
                    <td>${r.timestamp ? r.timestamp.slice(0,16).replace("T"," ") : "—"}</td>
                    <td>${r.disease}</td>
                    <td>${r.confidence}%</td>
                    <td>${r.language || "—"}</td>
                    <td>${r.village || "—"}</td>
                    <td>${fb(r.feedback)}</td>
                </tr>
            `).join("");
        }
    </script>
</body>
</html>
