<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kisan Mitra</title>
  <style>
    /* ── Design tokens ───────────────────────────────────────────────────── */
    :root {
      --green-900: #1b4332;
      --green-700: #2d6a4f;
      --green-500: #40916c;
      --green-100: #d8f3dc;
      --green-50:  #f1faee;
      --border:    #b7e4c7;
      --text:      #1b1b1b;
      --muted:     #5c5c5c;
      --white:     #fff;
      --grey:      #f4f4f4;
      --warn-bg:   #fff8e1;
      --warn-bdr:  #f9a825;
      --danger:    #b00020;
      --danger-bg: #fde8e8;
    }

    /* ── Reset ───────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--green-50);
      color: var(--text);
      line-height: 1.55;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 1rem; }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--green-900), var(--green-700));
      color: #fff;
      padding: 1.25rem 1rem;
      border-radius: 0 0 1rem 1rem;
      margin-bottom: 1rem;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p  { font-size: .88rem; opacity: .85; margin-top: 3px; }

    /* Status bar */
    #statusBar {
      font-size: .78rem;
      text-align: center;
      padding: 5px;
      background: var(--green-100);
      color: var(--green-900);
      border-radius: .4rem;
      margin-bottom: 1rem;
    }

    /* ── Cards ───────────────────────────────────────────────────────────── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: .75rem;
      padding: 1.1rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(27,67,50,.07);
    }
    .card h2 { font-size: 1rem; color: var(--green-900); margin-bottom: .85rem; font-weight: 700; }

    /* ── Form elements ───────────────────────────────────────────────────── */
    label { display: block; margin-bottom: .65rem; font-size: .9rem; }
    input[type="file"],
    input[type="text"],
    select,
    textarea {
      display: block;
      width: 100%;
      margin-top: .3rem;
      padding: .5rem .65rem;
      border: 1px solid var(--border);
      border-radius: .5rem;
      font-family: inherit;
      font-size: .9rem;
      background: var(--green-50);
    }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    .btn {
      display: inline-block;
      padding: .6rem 1.1rem;
      border: none;
      border-radius: .5rem;
      font-size: .93rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-primary  { background: var(--green-700); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--green-900); }
    .btn-outline  { background: transparent; border: 1.5px solid var(--green-700); color: var(--green-700); }
    .btn-block    { display: block; width: 100%; margin-top: .75rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Language selector ───────────────────────────────────────────────── */
    .lang-row { display: flex; gap: .5rem; margin-bottom: .85rem; }
    .lang-btn {
      flex: 1; padding: .5rem; border-radius: .5rem;
      border: 1.5px solid var(--border); background: var(--green-50);
      font-size: .85rem; font-weight: 600; cursor: pointer; text-align: center;
      color: var(--muted);
    }
    .lang-btn.active { background: var(--green-700); color: #fff; border-color: var(--green-700); }

    /* ── Diagnosis result ────────────────────────────────────────────────── */
    #preview img {
      width: 100%; max-height: 260px; object-fit: cover;
      border-radius: .5rem; margin-top: .75rem; border: 1px solid var(--border);
    }
    .conf-bar { height: 8px; background: var(--green-100); border-radius: 4px; margin: .4rem 0 .9rem; overflow: hidden; }
    .conf-fill { height: 100%; border-radius: 4px; background: var(--green-500); }

    .badge {
      display: inline-block; padding: 2px 10px;
      border-radius: 20px; font-size: .76rem; font-weight: 700;
      margin: 0 4px 6px 0;
    }
    .badge-kvk   { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }

    .warn-box {
      background: var(--warn-bg); border-left: 3px solid var(--warn-bdr);
      padding: .6rem .75rem; border-radius: .4rem; font-size: .87rem; margin: .5rem 0;
    }

    .section-lbl {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--green-500); margin-top: .75rem; margin-bottom: .2rem;
    }
    .section-body { font-size: .9rem; color: var(--text); line-height: 1.6; }

    .feedback-row { display: flex; gap: .5rem; margin-top: .85rem; align-items: center; }
    .feedback-row span { font-size: .83rem; color: var(--muted); }
    #feedbackMsg { font-size: .82rem; color: var(--green-500); margin-top: .4rem; }

    /* ── Chat ────────────────────────────────────────────────────────────── */
    .ctx-banner {
      background: var(--green-100); border-radius: .4rem;
      padding: .45rem .7rem; font-size: .82rem; color: var(--green-900);
      margin-bottom: .75rem;
    }
    .chat-box {
      min-height: 160px; max-height: 320px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: .5rem;
      padding: .75rem; background: var(--green-50);
      display: flex; flex-direction: column; gap: .5rem;
      margin-bottom: .75rem;
    }
    .msg {
      max-width: 84%; padding: .55rem .8rem; border-radius: .75rem;
      font-size: .9rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user      { align-self: flex-end; background: var(--green-700); color: #fff; border-bottom-right-radius: 3px; }
    .msg.assistant { align-self: flex-start; background: var(--white); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
    .msg.thinking  { align-self: flex-start; color: var(--muted); font-style: italic; font-size: .85rem; }

    .chat-input-row { display: flex; gap: .5rem; align-items: flex-end; }
    .chat-input-row textarea { flex: 1; min-height: 64px; resize: vertical; }

    .disclaimer { font-size: .75rem; color: var(--muted); text-align: center; margin-top: .6rem; }

    /* ── Disease reference ───────────────────────────────────────────────── */
    .d-item { border: 1px solid var(--border); border-radius: .5rem; margin-bottom: .5rem; overflow: hidden; }
    .d-item summary {
      padding: .6rem .8rem; cursor: pointer; font-weight: 600; font-size: .9rem;
      color: var(--green-900); background: var(--green-50); list-style: none;
      display: flex; justify-content: space-between; align-items: center;
    }
    .d-item summary::after { content: "▾"; font-size: .75rem; }
    .d-item[open] summary::after { content: "▴"; }
    .d-body { padding: .75rem; font-size: .88rem; border-top: 1px solid var(--border); }
    .d-body p { margin-bottom: .35rem; }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    footer { text-align: center; padding: 1rem; font-size: .82rem; color: var(--muted); }
    footer a { color: var(--green-700); text-decoration: none; font-weight: 600; }
    .error-text { color: var(--danger); font-size: .88rem; margin-top: .5rem; }
  </style>
</head>
<body>

<header>
  <div class="container">
    <h1>🌾 Kisan Mitra</h1>
    <p>AI Paddy Disease Advisor — Classifier + Chat</p>
  </div>
</header>

<div class="container">
  <div id="statusBar">Checking system…</div>

  <!-- ════════════════════════════════════════════════════════════════════
       SECTION 1 — Photo Diagnosis
       ════════════════════════════════════════════════════════════════════ -->
  <section class="card">
    <h2>📷 Diagnose Leaf Photo</h2>

    <!-- Language picker — shared with chat -->
    <div class="lang-row">
      <button class="lang-btn active" data-lang="hi" onclick="setLang('hi',this)">हिंदी</button>
      <button class="lang-btn"        data-lang="mr" onclick="setLang('mr',this)">मराठी</button>
      <button class="lang-btn"        data-lang="en" onclick="setLang('en',this)">English</button>
    </div>

    <label>Village (optional — saved for pilot tracking)
      <input type="text" id="villageInput" placeholder="e.g. Tirunelveli">
    </label>

    <label>Choose photo from gallery
      <input type="file" id="imageInput" accept="image/*" onchange="onFile(event)">
    </label>
    <label>Capture with camera
      <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="onFile(event)">
    </label>

    <div id="preview"></div>
    <div id="diagError" class="error-text"></div>
    <button class="btn btn-primary btn-block" id="diagnoseBtn" disabled onclick="runDiagnosis()">
      Diagnose Plant
    </button>
  </section>

  <!-- Result card — hidden until diagnosis runs -->
  <section class="card" id="resultCard" style="display:none">
    <h2>🔬 Diagnosis Result</h2>
    <div id="resultContent"></div>
    <div class="feedback-row">
      <span>Was this helpful?</span>
      <button class="btn btn-outline" onclick="submitFeedback(true)">👍 Yes</button>
      <button class="btn btn-outline" onclick="submitFeedback(false)">👎 No</button>
    </div>
    <p id="feedbackMsg"></p>
    <button class="btn btn-primary btn-block" onclick="askFollowUp()" style="margin-top:.6rem">
      💬 Ask about this disease
    </button>
  </section>

  <!-- ════════════════════════════════════════════════════════════════════
       SECTION 2 — Text Chat (LangGraph + SambaNova)
       ════════════════════════════════════════════════════════════════════ -->
  <section class="card">
    <h2>💬 Ask the Advisor</h2>
    <div id="ctxBanner" class="ctx-banner" style="display:none"></div>
    <div id="chatBox" class="chat-box" aria-live="polite"></div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="अपना सवाल लिखें…" onkeydown="chatKey(event)"></textarea>
      <button class="btn btn-primary" id="sendBtn" onclick="sendChat()">➤</button>
    </div>
    <p class="disclaimer">सलाह हमेशा अपने KVK से जाँचें — Kisan Mitra AI है, विशेषज्ञ नहीं।</p>
  </section>

  <!-- ════════════════════════════════════════════════════════════════════
       SECTION 3 — Disease Reference (offline after first load)
       ════════════════════════════════════════════════════════════════════ -->
  <section class="card">
    <h2>📚 Disease Reference</h2>
    <input type="text" id="searchBox" placeholder="Search disease…" oninput="filterDiseases(this.value)">
    <div id="diseaseList" style="margin-top:.75rem"></div>
  </section>
</div>

<footer>
  <a href="/dashboard" target="_blank">Field team dashboard →</a>
</footer>

<script>
"use strict";

// ── State ─────────────────────────────────────────────────────────────────────
const API            = window.location.origin;
let language         = "hi";
let selectedFile     = null;
let diagnosisId      = null;
let diagnosisContext = null;   // { disease, confidence } — passed to /chat
let chatHistory      = [];     // kept in memory, trimmed to last 12 messages
let diseasesData     = [];

// ── Language selector ─────────────────────────────────────────────────────────
function setLang(lang, btn) {
  language = lang;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const ph = { hi: "अपना सवाल लिखें…", mr: "आपला प्रश्न लिहा…", en: "Type your question…" };
  document.getElementById("chatInput").placeholder = ph[lang] || ph.hi;
}

// ── Health check ──────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const d   = await apiFetch("/health");
    const bar = document.getElementById("statusBar");

    const modelLabel = d.model_loaded
      ? `✅ Classifier ready (${d.num_classes} classes)`
      : "❌ Model not loaded — place rice_disease_model.tflite in backend/models/";

    const chatLabel = d.chat_configured
      ? `✅ Chat: ${d.chat_provider} / ${d.chat_model}`
      : `❌ Chat: not configured (set GROQ_API_KEY)`;

    bar.textContent = `${modelLabel}   |   ${chatLabel}`;
    bar.style.background = (d.model_loaded && d.chat_configured) ? "#d8f3dc" : "#fff3cd";
    bar.style.color      = (d.model_loaded && d.chat_configured) ? "#1b4332" : "#856404";
  } catch {
    document.getElementById("statusBar").textContent = "⚠️ Cannot reach backend on port 8000";
  }
}
checkHealth();

// ── Disease reference — load once, filter client-side ─────────────────────────
async function loadDiseases() {
  try {
    const d = await apiFetch("/diseases");
    diseasesData = d.diseases ?? [];
    renderDiseases("");
  } catch {
    document.getElementById("diseaseList").innerHTML =
      '<p class="error-text">Could not load disease list.</p>';
  }
}
loadDiseases();

function renderDiseases(query) {
  const q     = query.toLowerCase();
  const items = diseasesData.filter(d => d.name.toLowerCase().includes(q));
  const list  = document.getElementById("diseaseList");

  if (!items.length) {
    list.innerHTML = `<p style="color:var(--muted)">No diseases match "${esc(query)}"</p>`;
    return;
  }
  list.innerHTML = items.map(d => `
    <details class="d-item">
      <summary>
        ${esc(d.name)}
        ${d.refer_to_kvk ? '<span class="badge badge-kvk">⚠️ KVK</span>' : ""}
      </summary>
      <div class="d-body">
        <p><strong>Cause:</strong> ${esc(d.cause)}</p>
        ${d.severity_levels?.length ? `<p><strong>Severity:</strong> ${esc(d.severity_levels.join(" / "))}</p>` : ""}
        <p><strong>Organic:</strong> ${esc(d.organic_treatment)}</p>
        <p><strong>Chemical:</strong> ${esc(d.chemical_treatment)}</p>
        ${d.precautions ? `<p><strong>Precautions:</strong> ${esc(d.precautions)}</p>` : ""}
      </div>
    </details>`).join("");
}

function filterDiseases(q) { renderDiseases(q); }

// ── Photo diagnosis ───────────────────────────────────────────────────────────
function onFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;
  document.getElementById("preview").innerHTML =
    `<img src="${URL.createObjectURL(file)}" alt="Leaf photo">`;
  document.getElementById("diagnoseBtn").disabled = false;
  document.getElementById("diagError").textContent = "";
  document.getElementById("resultCard").style.display = "none";
}

async function runDiagnosis() {
  if (!selectedFile) return;
  const btn = document.getElementById("diagnoseBtn");
  btn.disabled = true;
  btn.textContent = "Diagnosing…";
  document.getElementById("diagError").textContent = "";

  const form = new FormData();
  form.append("image",    selectedFile);
  form.append("language", language);
  const village = document.getElementById("villageInput").value.trim();
  if (village) form.append("village", village);

  try {
    const data = await apiFetch("/diagnose", { method: "POST", body: form });
    renderResult(data);
  } catch (err) {
    document.getElementById("diagError").textContent = "❌ " + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Diagnose Plant";
  }
}

function renderResult(d) {
  const t = d.treatment;
  diagnosisId      = d.diagnosis_id;
  diagnosisContext = { disease: d.disease, confidence: d.confidence };

  // Update chat context banner
  const banner = document.getElementById("ctxBanner");
  banner.style.display = "block";
  banner.textContent   = `📋 Last diagnosis: ${d.disease} (${d.confidence.toFixed(1)}%)`;

  const kvkBadge = t.refer_to_kvk
    ? `<span class="badge badge-kvk">⚠️ Consult KVK immediately</span>`
    : "";
  const isNormal = d.disease === "Normal";
  const treatment = isNormal
    ? `<p style="color:var(--green-700);margin-top:.5rem">✅ Plant looks healthy. Keep monitoring regularly.</p>`
    : `
      <div class="section-lbl">Cause</div>
      <div class="section-body">${esc(t.cause)}</div>
      <div class="section-lbl">Organic treatment</div>
      <div class="section-body">${esc(t.organic_treatment)}</div>
      <div class="section-lbl">Chemical treatment</div>
      <div class="section-body">${esc(t.chemical_treatment)}</div>
      ${t.precautions ? `<div class="section-lbl">Precautions</div><div class="section-body">${esc(t.precautions)}</div>` : ""}
    `;

  document.getElementById("resultContent").innerHTML = `
    <div>${kvkBadge}</div>
    <h3 style="font-size:1.3rem;color:var(--green-900);margin:.3rem 0">${esc(d.disease)}</h3>
    <p style="font-size:.85rem;color:var(--muted)">Confidence: ${d.confidence.toFixed(1)}%</p>
    <div class="conf-bar"><div class="conf-fill" style="width:${Math.min(d.confidence,100)}%"></div></div>
    ${treatment}
  `;
  document.getElementById("feedbackMsg").textContent = "";
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("resultCard").scrollIntoView({ behavior: "smooth" });
}

async function submitFeedback(helpful) {
  if (!diagnosisId) return;
  try {
    await apiFetch("/diagnose/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ diagnosis_id: diagnosisId, helpful }),
    });
    document.getElementById("feedbackMsg").textContent = "Thank you for your feedback!";
  } catch { /* non-critical */ }
}

function askFollowUp() {
  document.querySelector("section.card:nth-of-type(3)").scrollIntoView({ behavior: "smooth" });
  document.getElementById("chatInput").focus();
}

// ── Text chat ─────────────────────────────────────────────────────────────────
function chatKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

function addMsg(role, text) {
  const box = document.getElementById("chatBox");
  const el  = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}

async function sendChat() {
  const input = document.getElementById("chatInput");
  const msg   = input.value.trim();
  if (!msg) return;

  input.value = "";
  document.getElementById("sendBtn").disabled = true;
  addMsg("user", msg);
  chatHistory.push({ role: "user", content: msg });

  const thinking = addMsg("thinking", "Thinking…");

  try {
    const data = await apiFetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message:              msg,
        language,
        diagnosis_context:    diagnosisContext,  // null until a diagnosis has been run
        conversation_history: chatHistory.slice(-12),
      }),
    });

    thinking.remove();
    addMsg("assistant", data.reply);
    chatHistory.push({ role: "assistant", content: data.reply });
    if (chatHistory.length > 12) chatHistory = chatHistory.slice(-12);

    // Only pass diagnosis context on the first follow-up question, then clear it
    // so subsequent questions are treated as general farming questions
    diagnosisContext = null;
    document.getElementById("ctxBanner").style.display = "none";

  } catch (err) {
    thinking.remove();
    addMsg("assistant",
      err.status === 503
        ? "Chat not available. Check that SAMBANOVA_API_KEY is set in .env and restart the server."
        : "Error: " + err.message
    );
  } finally {
    document.getElementById("sendBtn").disabled = false;
  }
}

// ── API helper ────────────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const res  = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.detail || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data;
}

// ── XSS-safe HTML escape ──────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
</script>
</body>
</html>
